name: Publish audited Universal Player v1.0.1 stable
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.0.1-stable-once.yml]
permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'DYDjwp/universal-player-extension'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited Chrome source
        uses: actions/checkout@v4
        with:
          ref: f870baf2b4b7d191574858b3a56feda5af9db81d
          path: chrome
      - name: Checkout audited Firefox source
        uses: actions/checkout@v4
        with:
          ref: 9a85d6d0db211ec01b8fadab2c0202c06ee9c43b
          path: firefox
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate manifests and run all unit tests
        shell: bash
        run: |
          set -euo pipefail
          for browser in chrome firefox; do
            (
              cd "$browser"
              find . -name '*.js' -not -path './player/libs/*' -print0 | xargs -0 -n1 node --check
              node --test tests/*.test.cjs
            )
            node - "$browser" <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root=process.argv[2];
          const m=JSON.parse(fs.readFileSync(path.join(root,'manifest.json'),'utf8'));
          const ver=JSON.parse(fs.readFileSync(path.join(root,'language/en.json'),'utf8'));
          if(m.version!=='1.0.1'||ver['app.version']!=='v1.0.1')throw Error('Version mismatch');
          if(m.permissions.includes('declarativeNetRequestFeedback'))throw Error('Development-only permission');
          if(m.icons['128']!=='assets/icon/icon-128.png')throw Error('Incorrect icon');
          const icon=fs.readFileSync(path.join(root,m.icons['128']));
          if(icon.readUInt32BE(16)!==128||icon.readUInt32BE(20)!==128)throw Error('Icon dimensions invalid');
          if(root==='firefox'){
            if(!m.browser_specific_settings.gecko.data_collection_permissions?.required.includes('browsingActivity'))throw Error('Firefox disclosure missing');
            if(!m.browser_specific_settings.gecko.data_collection_permissions?.required.includes('websiteContent'))throw Error('Firefox website content disclosure missing');
            for(const file of m.background.scripts)if(!fs.existsSync(path.join(root,file)))throw Error('Missing background file: '+file);
            if(!fs.existsSync(path.join(root,'player/libs/hls.min.js')))throw Error('Missing Firefox HLS library');
          }else if(m.background.service_worker!=='background.js')throw Error('Chrome background config incorrect');
          console.log(root,'manifest, version, permissions, assets checked');
          NODE
          done
      - name: Build stable ZIPs and backwards-compatible asset aliases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for browser in chrome firefox; do
            (
              cd "$browser"
              zip -q -r "../artifacts/universal-player-$browser.zip" \
                LICENSE THIRD_PARTY_NOTICES.md README.md README.zh.md \
                manifest.json background.js initial.js intercept-console-clear.js \
                assets content history language player popup setting shared theme \
                -x '*.DS_Store' '__MACOSX/*'
            )
            unzip -p "artifacts/universal-player-$browser.zip" manifest.json | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const m=JSON.parse(s);if(m.version!=='1.0.1')process.exit(1)})"
            cp "artifacts/universal-player-$browser.zip" "artifacts/universal-player-$browser-beta.zip"
          done
          (cd artifacts && sha256sum *.zip > SHA256SUMS.txt)
      - name: Prepare stable release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # Universal Player v1.0.1 — Stable

          Stable GitHub release for **Chrome / Chromium** and **Firefox**.
          This release supersedes the `v1.0.1-beta` build **in place** at the original `1.0.1` tag.

          ## Features
          - Replace supported streaming players with a unified player and configurable danmaku.
          - HLS support, playback speed controls, watch history and resume.
          - Watch-history backup import/export with validated, serialized merging.
          - Optional developer switch for intercepting console.clear() — **off by default**.

          ## Release fixes and review
          - Fixed Firefox Promise-based messaging for watch-history saving.
          - Progress saving no longer waits for potentially unresponsive remote metadata.
          - Prevented metadata hydration from restoring deleted history records.
          - Hardened history rendering to avoid dynamic HTML injection in first-party code.
          - Restricted debug content script registration to authorized HTTPS pages.
          - Removed development-only DNR feedback permission.
          - Corrected the 128x128 PNG icon, stable version text, and README badges.
          - Disclosed external browsing URL / webpage data transmission in Firefox's manifest.

          ## Downloads
          - **Chrome:** `universal-player-chrome.zip`
          - **Firefox:** `universal-player-firefox.zip`
          - `SHA256SUMS.txt` to verify downloads.
          - Prior `*-beta.zip` URLs are retained as identical, updated ZIP aliases for existing users.

          ## Important notes
          - This is a GitHub self-hosted release. The Firefox ZIP is **not Mozilla-signed**. For permanent installation, it must be signed by Mozilla; it may be loaded as a temporary add-on for testing.
          - Playback services receive selected video page URLs and related media metadata over the network to resolve streaming sources and danmaku. The extension does not provide a separate built-in proxy/VPN.
          - The Firefox add-on linter reported zero errors. Remaining warnings concern vendored Media Chrome template DOM APIs and the data-consent manifest field not being recognized by older Firefox versions. Browser/device playback is not exhaustively smoke-tested.

          ## Verification
          - Chrome and Firefox: 28 automated Node.js regression tests passed each, first-party JavaScript syntax validated.
          - Firefox Mozilla web-ext validation: 0 errors.

          **Source revisions:**
          - Chrome: `f870baf2b4b7d191574858b3a56feda5af9db81d`
          - Firefox: `9a85d6d0db211ec01b8fadab2c0202c06ee9c43b`
          EOF
      - name: Replace original Release assets and promote to stable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: DYDjwp/universal-player-extension
        shell: bash
        run: |
          set -euo pipefail
          current_tag="$(gh api "repos/$GH_REPO/git/ref/tags/1.0.1" --jq '.object.sha')"
          test "$current_tag" = "c64c12631475917943330ca8b945b91606f956c8"
          gh release upload 1.0.1 \
            artifacts/universal-player-chrome.zip \
            artifacts/universal-player-firefox.zip \
            artifacts/universal-player-chrome-beta.zip \
            artifacts/universal-player-firefox-beta.zip \
            artifacts/SHA256SUMS.txt \
            --clobber

          for file in universal-player-chrome.zip universal-player-firefox.zip universal-player-chrome-beta.zip universal-player-firefox-beta.zip SHA256SUMS.txt; do
            local_hash="$(sha256sum "artifacts/$file" | awk '{print $1}')"
            remote_hash="$(gh api "repos/$GH_REPO/releases/tags/1.0.1" --jq ".assets[] | select(.name == \"$file\") | .digest")"
            if [ "$remote_hash" != "sha256:$local_hash" ]; then
              echo "Integrity check failed for $file" >&2
              exit 1
            fi
          done

          gh api --method PATCH "repos/$GH_REPO/releases/366406213" \
            -f name="v1.0.1" \
            -f body="$(cat RELEASE_NOTES.md)" \
            -F prerelease=false \
            -F draft=false > /dev/null

          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/1.0.1" \
            -f sha="f870baf2b4b7d191574858b3a56feda5af9db81d" \
            -F force=true > /dev/null

          gh api "repos/$GH_REPO/releases/tags/1.0.1" \
            --jq '{name: .name, prerelease: .prerelease, draft: .draft, tag: .tag_name, assets: [.assets[].name]}'
          test "$(gh api "repos/$GH_REPO/releases/tags/1.0.1" --jq '.prerelease')" = "false"
          test "$(gh api "repos/$GH_REPO/git/ref/tags/1.0.1" --jq '.object.sha')" = "f870baf2b4b7d191574858b3a56feda5af9db81d"
