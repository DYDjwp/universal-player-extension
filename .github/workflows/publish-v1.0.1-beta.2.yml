name: Publish Universal Player v1.0.1-beta.2

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.0.1-beta.2.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'DYDjwp/universal-player-extension'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested Chrome commit
        uses: actions/checkout@v4
        with:
          ref: b881d6a46d9c9d06b39a5f9a78efa948ce4bcb89
          path: chrome

      - name: Checkout tested Firefox commit
        uses: actions/checkout@v4
        with:
          ref: f2ffe4f9ec8e19a22793039125a3b035f626741c
          path: firefox

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify both variants
        shell: bash
        run: |
          set -euo pipefail
          for browser in chrome firefox; do
            node --check "$browser/background.js"
            node --check "$browser/history/history.js"
            (cd "$browser" && node --test tests/watch-history.test.cjs)
          done
          node -e "const c=require('./chrome/manifest.json');const f=require('./firefox/manifest.json');if(c.version!=='1.0.1'||f.version!=='1.0.1'||!f.browser_specific_settings?.gecko||!c.background?.service_worker||!f.background?.scripts)process.exit(1)"

      - name: Package extension roots and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for browser in chrome firefox; do
            (
              cd "$browser"
              zip -q -r "../artifacts/universal-player-$browser-beta.zip" \
                LICENSE THIRD_PARTY_NOTICES.md README.md README.zh.md \
                manifest.json background.js initial.js intercept-console-clear.js \
                assets content history language player popup setting shared theme \
                -x '*.DS_Store'
            )
            unzip -p "artifacts/universal-player-$browser-beta.zip" manifest.json | node -e "let x='';process.stdin.on('data',b=>x+=b).on('end',()=>{if(JSON.parse(x).version!=='1.0.1')process.exit(1)})"
          done
          (cd artifacts && sha256sum *.zip > SHA256SUMS.txt)

      - name: Prepare release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Universal Player v1.0.1-beta.2 — Watch History Fix

          Beta patch release for **Chrome** and **Firefox**. The extension manifest stays at `1.0.1`; the user-facing beta label stays `v1.0.1-beta`.

          ### Fixes
          - Import backups in one validated, serialized storage operation rather than one write per record.
          - Correctly handle empty backups, invalid records, duplicate URLs, and storage failures.
          - Merge by update timestamp, preserving newer local watch progress.
          - Allow manual backup import even when automatic history recording is disabled.
          - Fix the clear-versus-save race and avoid writes during history reads.
          - Display counts of added, updated, and skipped records after import.
          - Fix the Firefox import/export browser API calls and storage quota display compatibility on older Firefox.
          - Correct the history page's root CSS selector.

          ### Packages
          - `universal-player-chrome-beta.zip`: Chrome/Chromium extension folder; extract and choose **Load unpacked**.
          - `universal-player-firefox-beta.zip`: Firefox extension folder; extract and load as a temporary add-on (or package/sign separately for persistent installation).
          - `SHA256SUMS.txt`: checksums for both archives.

          Both variants passed JavaScript syntax checks and Node.js history regression tests.

          **Source commits:** Chrome `b881d6a46d9c9d06b39a5f9a78efa948ce4bcb89`; Firefox `f2ffe4f9ec8e19a22793039125a3b035f626741c`.
          EOF

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create 1.0.1-beta.2 \
            artifacts/universal-player-chrome-beta.zip \
            artifacts/universal-player-firefox-beta.zip \
            artifacts/SHA256SUMS.txt \
            --title 'v1.0.1-beta.2 (history fixes)' \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            --target "${GITHUB_SHA}"
