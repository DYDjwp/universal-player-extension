name: Retag existing v1.0.1 prerelease to fixed source
on:
  push:
    branches: [main]
    paths: [.github/workflows/retag-v1.0.1-once.yml]
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Retag existing release and validate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: DYDjwp/universal-player-extension
        shell: bash
        run: |
          set -euo pipefail
          tag=1.0.1
          expected=78d3f41d27a43cd096ee4731b62347b57b690a5c
          target=e649da01569e6749e75df8f685088f189fd21c48
          current="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')"
          if [ "$current" != "$expected" ]; then
            echo "Tag changed unexpectedly: $current" >&2
            exit 1
          fi
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" \
            -f sha="$target" -F force=true > /dev/null
          actual="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')"
          test "$actual" = "$target"
          gh api "repos/$GH_REPO/releases/tags/$tag" \
            --jq '{name: .name, tag_name: .tag_name, assets: [.assets[].name], prerelease: .prerelease}'
