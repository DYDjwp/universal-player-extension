name: Refresh v1.0.1-beta optional debug setting
on:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-optional-debug-once.yml]
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'DYDjwp/universal-player-extension'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c64c12631475917943330ca8b945b91606f956c8
          path: chrome
      - uses: actions/checkout@v4
        with:
          ref: a7d29503279565939c4a712ea92677ad76b2d6c5
          path: firefox
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test both browser variants
        shell: bash
        run: |
          set -euo pipefail
          for browser in chrome firefox; do
            (
              cd "$browser"
              node --check background.js
              node --check intercept-console-clear.js
              node --check shared/console-clear-debug.js
              node --check setting/setting.js
              node --test tests/*.test.cjs
            )
          done
      - name: Build Chrome and Firefox ZIP packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for browser in chrome firefox; do
            (
              cd "$browser"
              zip -q -r "../artifacts/universal-player-$browser-beta.zip" \
                LICENSE THIRD_PARTY_NOTICES.md README.md README.zh.md \
                manifest.json background.js initial.js intercept-console-clear.js \
                assets content history language player popup setting shared theme \
                -x '*.DS_Store'
            )
            unzip -p "artifacts/universal-player-$browser-beta.zip" manifest.json |
              node -e "let t='';process.stdin.on('data',c=>t+=c).on('end',()=>{const m=JSON.parse(t); if(m.version!=='1.0.1'||m.content_scripts?.some(s=>s.js?.includes('intercept-console-clear.js')))process.exit(1)})"
          done
          (cd artifacts && sha256sum *.zip > SHA256SUMS.txt)
      - name: Release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Universal Player v1.0.1-beta

          ### Latest update: optional console.clear debugging
          - The developer console.clear interceptor is **disabled by default**. Ordinary users no longer receive the installed-interceptor message or have console.clear modified.
          - Added an optional switch under **Settings → Developer Options**. Developers can enable it to log console.clear calls and stack traces.
          - Changing this setting affects newly loaded pages; reload existing tabs to apply it.
          - Chrome and Firefox each register/unregister the debug script dynamically in the main execution world when needed. Firefox 128+ is supported.
          - Made the debug console.clear override configurable to avoid permanently locking the function in newly loaded pages.

          ### Watch history fixes (included)
          - Validate imported backups before writing and import in one serialized storage operation.
          - Handle empty backups, duplicate records, invalid records, and write failures correctly.
          - Merge by update timestamp and preserve newer local progress.
          - Allow manual backup import when automatic history recording is off.
          - Resolve the clear-versus-save race and fix Firefox history import compatibility.
          - Include a Firefox storage usage fallback and bilingual import summaries.

          ### Downloads
          - `universal-player-chrome-beta.zip` — extract and use **Load unpacked** in Chrome/Chromium.
          - `universal-player-firefox-beta.zip` — for Firefox temporary installation/testing; permanent distribution may require Mozilla signing.
          - `SHA256SUMS.txt` — integrity verification for both archives.

          Both variants passed all automated Node.js regression tests and syntax checks. The extension manifest version remains `1.0.1` and the UI label remains `v1.0.1-beta`.

          Chrome source commit: `c64c12631475917943330ca8b945b91606f956c8`.
          Firefox source commit: `a7d29503279565939c4a712ea92677ad76b2d6c5`.
          EOF
      - name: Replace existing v1.0.1-beta Release and retag source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: DYDjwp/universal-player-extension
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GH_REPO/git/ref/tags/1.0.1" --jq '.object.sha')"
          test "$existing" = "e649da01569e6749e75df8f685088f189fd21c48"
          gh release upload 1.0.1 \
            artifacts/universal-player-chrome-beta.zip \
            artifacts/universal-player-firefox-beta.zip \
            artifacts/SHA256SUMS.txt --clobber
          gh release edit 1.0.1 --title 'v1.0.1-beta' --notes-file RELEASE_NOTES.md --prerelease
          for file in universal-player-chrome-beta.zip universal-player-firefox-beta.zip SHA256SUMS.txt; do
            actual="$(sha256sum "artifacts/$file" | awk '{print $1}')"
            uploaded="$(gh api "repos/$GH_REPO/releases/tags/1.0.1" --jq ".assets[] | select(.name == \"$file\") | .digest")"
            test "$uploaded" = "sha256:$actual" || { echo "Asset digest mismatch for $file"; exit 1; }
          done
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/1.0.1" \
            -f sha="c64c12631475917943330ca8b945b91606f956c8" -F force=true > /dev/null
          test "$(gh api "repos/$GH_REPO/git/ref/tags/1.0.1" --jq '.object.sha')" = "c64c12631475917943330ca8b945b91606f956c8"
